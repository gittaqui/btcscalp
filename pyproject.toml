[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "btcscalp"
version = "0.1.0"
description = "Cost-aware BTC/USD spot research and guarded execution"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7", "httpx[socks]>=0.28,<1", "websockets>=15,<17", "python-socks[asyncio]>=2.7,<3", "numpy>=2,<3"]

[project.optional-dependencies]
research = ["pyarrow>=19,<24"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
btcscalp = "trader.cli:main"

[tool.setuptools.packages.find]
include = ["trader*"]

[tool.setuptools.package-data]
trader = ["dashboard.html", "dashboard.js", "storage/schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["sandbox: opt-in Gemini sandbox network integration", "network: public network test"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
